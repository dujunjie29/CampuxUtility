name: Release Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'src/**'
      - '.github/workflows/build-latest-image.yaml'
      - 'main.py'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Create Buildx
      run: docker buildx create --name mybuilder --use
    - name: Build
      run: docker buildx build --platform linux/arm64,linux/amd64 -t rockchin/campuxutility:latest
    - name: Save Image
      run: docker save rockchin/campuxutility:latest -o image.tar
    - uses: actions/upload-artifact@v2
      with:
        name: docker-image
        path: image.tar

    - name: Push Finish Notification
      run: |
        curl --location '${{ secrets.ONEBOT_V11_ENDPOINT }}/send_group_msg' \
          --header 'Content-Type: application/json' \
          --header 'Authorization: Bearer ${{ secrets.ONEBOT_V11_TOKEN }}' \
          --data '{
              "group_id": ${{ secrets.ONEBOT_V11_GROUP_ID }},
              "message": "CampuxUtility 构建完成。"
          }'
